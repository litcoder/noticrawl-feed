[package]
name = "noticrawl"
version = "1.0.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
blake3 = "1.8.3"
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.9"
indexmap = "2.13.0"
log = "0.4.29"
reqwest = { version = "0.13.2", features = ["json"] }
tokio-rusqlite = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "macros"] }
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
toml = "1.1.0"
quick-xml = { version = "0.39.2", features = ["serialize"] }
rss = "2.0.12"
uuid = "1.23.1"
base64 = "0.22.1"
url = "2.5.8"

[dev-dependencies]
mockito = "1.5"
